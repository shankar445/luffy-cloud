<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Cloud Web Page</title>
</head>
<!-- Inline CSS: background color, font family, and centered layout -->
<body style="background-color: #f1f5f9; font-family: Arial, sans-serif; text-align: center; padding: 40px 20px; color: #1e293b;">

    <!-- Inline CSS: custom heading color -->
    <h1 style="color: #0284c7; font-size: 2.2rem; margin-bottom: 8px;">
        My First Cloud Web Page
    </h1>
    <p style="color: #64748b; font-size: 1.1rem; margin-bottom: 25px;">
        Welcome to my cloud-hosted webpage on GitHub Pages!
    </p>

    <!-- Bonus Task 1: Images (Luffy rotated upright + a scenic background image) -->
    <div style="margin: 20px auto;">
        <img src="luffy.jpg" alt="Luffy" width="220" style="transform: rotate(180deg); border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); margin: 10px;">
        <img src="https://picsum.photos/id/1018/280/280" alt="Cloud Landscape" style="border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); margin: 10px;">
    </div>

    <!-- Bonus Task 2: Additional Links -->
    <div style="margin-top: 30px;">
        <p style="font-weight: bold; margin-bottom: 8px;">Explore More Links:</p>
        <a href="https://www.google.com" target="_blank" style="color: #0284c7; text-decoration: none; font-weight: bold; margin: 0 10px;">Visit Google</a> |
        <a href="https://github.com" target="_blank" style="color: #0284c7; text-decoration: none; font-weight: bold; margin: 0 10px;">Visit GitHub</a> |
        <a href="https://one-piece.com" target="_blank" style="color: #0284c7; text-decoration: none; font-weight: bold; margin: 0 10px;">One Piece Official</a>
    </div>

</body>
</html>
